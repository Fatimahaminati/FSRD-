<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fakultas seni rupa dan desain ums</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .site-title { font-family: 'Playfair Display', serif; font-weight: 700; }
        .subhead { font-family: 'Montserrat', sans-serif; font-weight: 500; letter-spacing: 0.2px; }
        .bg-ums { background-color: #800000; }
        .btn-ums { background-color: #800000; border-color: #4b0000; color: #ffffff !important; }
        .btn-ums:hover, .btn-ums:focus { background-color: #a00000; border-color: #4b0000; color: #ffffff !important; }
        .text-ums { color: #800000; }
        .navbar { border-bottom: 4px solid #4b0000; }
        .navbar .nav-link { color: #ffffff !important; }
        .navbar .nav-link:hover { color: #ffcc00 !important; }
        .navbar .navbar-brand { color: #ffffff !important; }
        /* About dropdown on hover */
        .nav-item.dropdown:hover > .dropdown-menu { display: block; }
        .navbar .dropdown-menu { background-color: #800000; border: none; }
        .navbar .dropdown-item { color: #ffffff; }
        .navbar .dropdown-item:hover { color: #ffcc00; background-color: rgba(255,255,255,0.03); }
        footer { background: #1a1a1a; color: white; padding: 40px 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-ums sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">FSRD</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'berita_list' %}">Berita</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'dosen_list' %}">Tenaga Akademik</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'akademik' %}">Akademik</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="aboutDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">About</a>
                        <ul class="dropdown-menu" aria-labelledby="aboutDropdown">
                            <li><a class="dropdown-item" href="{% url 'kontak' %}">Kontak</a></li>
                            <li><a class="dropdown-item" href="#sosial">Sosial Media</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 Fakultas Seni Rupa dan Desain Universitas Muhammadiyah Surakarta</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
